name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: absensi
          POSTGRES_USER: absensi
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U absensi -d absensi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://absensi:ci-only-password@localhost:5432/absensi?schema=public
      APP_URL: http://localhost:3000
      APP_TIMEZONE: Asia/Jakarta
      SEED_ADMIN_EMAIL: admin@example.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
      SEED_ADMIN_NAME: Administrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t absensi-ci .
